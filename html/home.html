<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-logo {
        width: 40px;
        height: 40px;
        object-fit: cover; /* Для корректного отображения неквадратных изображений */
        }
        .card {
            transition: transform 0.3s;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .main-content {
            padding: 2rem;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">
        <!-- Сайдбар -->
        <div class="col-md-3 col-lg-2 text-bg-dark p-3 d-flex flex-column">
            <!-- Шапка сайдбара -->
            <div class="d-flex align-items-center mb-4">
                <img src="img/B.jpg" alt="Логотип" class="sidebar-logo rounded-circle me-2">
                <h4 class="mb-0">Меню</h4>
            </div>
            <hr class="border border-white border-1 opacity-50 my-3">
            <!-- Основное меню -->
            <div class="flex-grow-1">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white" href="home.html">
                            <i class="fas fa-home me-2"></i> Главная
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-list me-2"></i> Категории
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-shopping-bag me-2"></i> Заказы
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">
                            <i class="fas fa-envelope me-2"></i> Контакты
                        </a>
                    </li>
                </ul>
            </div>
            <!-- Блок пользователя -->
            <div class="mt-auto">
                <hr class="border border-white border-1 opacity-50 my-3">
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                       id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="img/user.png" alt="User" class="rounded-circle me-2"
                             style="width: 32px; height: 32px;">
                        <span>Пользователь</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="dropdownUser">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i> Профиль</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt me-2"></i> Выход</a></li>
                    </ul>
                </div>
            </div>

        </div>
        <!-- Основной контент (10 колонок) -->
        <div class="col-md-9 col-lg-10 main-content">
            <h1 class="text-center mb-4">Главная</h1>
            <h6 class="text-center mb-5 text-muted">Вы находитесь на сайте, предназначенном для продажи товаров</h6>
            <!-- Сетка товаров -->
            <div class="row g-4">
                <!-- Товар 1 -->
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <div class="card-header bg-light text-dark">
                            <h5 class="text-center mb-0">Товар 1</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title text-center my-3">100$</h3>
                            <p class="card-text text-center flex-grow-1">Описание товара.</p>
                            <div class="text-center mt-auto">
                                <a href="#" class="btn btn-outline-primary w-75">
                                    <i class="fas fa-shopping-cart me-2"></i>Купить
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Товар 2 -->
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <div class="card-header bg-light text-dark">
                            <h5 class="text-center mb-0">Товар 1</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title text-center my-3">100$</h3>
                            <p class="card-text text-center flex-grow-1">Описание товара.</p>
                            <div class="text-center mt-auto">
                                <a href="#" class="btn btn-outline-primary w-75">
                                    <i class="fas fa-shopping-cart me-2"></i>Купить
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Товар 3 -->
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <div class="card-header bg-light text-dark">
                            <h5 class="text-center mb-0">Товар 1</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title text-center my-3">100$</h3>
                            <p class="card-text text-center flex-grow-1">Описание товара.</p>
                            <div class="text-center mt-auto">
                                <a href="#" class="btn btn-outline-primary w-75">
                                    <i class="fas fa-shopping-cart me-2"></i>Купить
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
